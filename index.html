<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svenjas Adventskalender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0d1b2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: Winternacht über einem verschneiten Dorf, 24 Türchen als dichtes Raster in gemischter Reihenfolge, Inhalt im Overlay */
:root {
  color-scheme: dark;
  --night: #0d1b2e;
  --night-2: #13284a;
  --snow: #f4f1ea;
  --snow-dim: #b9c3d6;
  --gold: #e8b84a;
  --red: #a8322d;
  --green: #1f5a44;
  --plum: #5b2a4a;
  --glow: #ffd98a;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% 0%, var(--night-2), var(--night) 70%) fixed, var(--night);
  color: var(--snow);
  font-family: var(--font-body);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.wrap {
  position: relative; z-index: 1;
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 0;
  display: flex; flex-direction: column; gap: 20px;
}
header { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(30px, 9vw, 44px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 500; color: var(--glow); }
.status { color: var(--snow-dim); font-size: 15px; margin: 4px 0 0; }

.demo {
  border: 1px dashed rgba(232,184,74,.55); border-radius: 12px;
  padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px;
  background: rgba(13,27,46,.6);
}
.demo label { display: flex; justify-content: space-between; gap: 12px; color: var(--gold); font-weight: 800; }
.demo input { width: 100%; accent-color: var(--gold); }
.demo button { align-self: flex-start; background: none; border: 0; color: var(--snow-dim); text-decoration: underline; font: inherit; padding: 0; cursor: pointer; }

.grid {
  display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 1fr;
  grid-auto-flow: dense; gap: 8px;
}
.grid::before { content: ""; width: 0; padding-bottom: 100%; grid-row: 1 / 1; grid-column: 1 / 1; }
.grid > *:first-child { grid-row: 1 / 1; grid-column: 1 / 1; }
.wide { grid-column: span 2; }
.big { grid-column: span 2; grid-row: span 2; }

.door {
  position: relative; perspective: 700px; border: 0; padding: 0; margin: 0;
  background: transparent; cursor: pointer; border-radius: 10px; font: inherit; color: inherit;
  min-height: 0;
}
.door:focus-visible { outline: 3px solid var(--glow); outline-offset: 3px; }
.inside {
  position: absolute; inset: 0; border-radius: 10px;
  background: radial-gradient(circle at 50% 45%, #fff4d6, var(--glow) 40%, #c8892c 100%);
  display: grid; place-items: center; font-size: clamp(26px, 8vw, 40px);
  box-shadow: inset 0 0 0 3px rgba(0,0,0,.25), inset 0 6px 14px rgba(0,0,0,.35);
}
.big .inside { font-size: clamp(48px, 16vw, 80px); }
.leaf {
  position: absolute; inset: 0; border-radius: 10px;
  background: var(--c, var(--red));
  background-image:
    linear-gradient(135deg, rgba(255,255,255,.14), rgba(255,255,255,0) 45%),
    radial-gradient(circle at 20% 80%, rgba(255,255,255,.08) 0 2px, transparent 3px),
    radial-gradient(circle at 75% 25%, rgba(255,255,255,.08) 0 2px, transparent 3px);
  background-size: auto, 22px 22px, 26px 26px;
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.35);
  transform-origin: left center;
  transition: transform .9s cubic-bezier(.3,1.3,.5,1);
  display: grid; place-items: center;
  backface-visibility: hidden;
}
.leaf::after { /* Türgriff */
  content: ""; position: absolute; right: 9%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold); transform: translateY(-50%); opacity: .8;
}
.num { font-family: var(--font-display); font-weight: 600; font-size: clamp(22px, 7vw, 32px); text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.big .num { font-size: clamp(44px, 15vw, 72px); }
.door.open .leaf { transform: rotateY(-100deg); }
.door.locked .leaf { filter: saturate(.55) brightness(.8); }
.door.today .leaf { box-shadow: inset 0 0 0 2px var(--glow), 0 0 18px 2px rgba(255,217,138,.55); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: inset 0 0 0 2px var(--glow), 0 0 26px 6px rgba(255,217,138,.75); } }
.door.wiggle .leaf { animation: wiggle .45s; }
@keyframes wiggle { 20%{transform:rotateY(-14deg)} 45%{transform:rotateY(4deg)} 70%{transform:rotateY(-7deg)} 100%{transform:none} }
.lock { position: absolute; bottom: 6px; right: 7px; width: 11px; height: 9px; border-radius: 2px; background: rgba(244,241,234,.55); }
.lock::before { content:""; position:absolute; left: 2px; top: -6px; width: 7px; height: 7px; border: 2px solid rgba(244,241,234,.55); border-bottom: 0; border-radius: 5px 5px 0 0; box-sizing: border-box; }
.door:not(.locked) .lock { display: none; }

.village { position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: 24px; }
footer { position: relative; z-index: 1; background: var(--snow); color: #2a3a55; text-align: center; padding: 4px 16px 28px; font-size: 13px; }

/* Overlay mit Inhalt */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(5,10,20,.72);
  display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity: 0; transition: opacity .25s;
}
.overlay.show { opacity: 1; }
.card {
  width: min(100%, 400px); background: var(--snow); color: #1d2a40; border-radius: 18px;
  padding: 26px 22px 20px; display: flex; flex-direction: column; gap: 10px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); transform: translateY(14px) scale(.96); transition: transform .3s;
  border-top: 6px solid var(--red);
}
.overlay.show .card { transform: none; }
.card .big-emoji { font-size: 64px; line-height: 1; }
.card .day { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); font-weight: 800; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; text-wrap: balance; }
.card p { margin: 0; line-height: 1.55; font-size: 16px; }
.card .sig { font-family: var(--font-display); font-style: italic; color: var(--green); }
.card button { margin-top: 8px; align-self: center; border: 0; background: var(--green); color: var(--snow); font: 800 15px var(--font-body); padding: 12px 26px; border-radius: 999px; cursor: pointer; }
.card button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; transition: .25s;
  background: var(--snow); color: #1d2a40; padding: 12px 18px; border-radius: 12px;
  font-weight: 600; font-size: 15px; width: max-content; max-width: calc(100% - 32px); text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .leaf, .overlay, .card, .toast { transition: none; }
  .door.today .leaf, .door.wiggle .leaf { animation: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <span class="eyebrow">Von Lenny für Mama</span>
    <h1>Svenjas <em>Advents&shy;kalender</em></h1>
    <p class="status" id="status"></p>
  </header>

  <!-- Nur mit ?demo im Link sichtbar: Datum simulieren -->
  <div class="demo" id="demo" hidden>
    <label for="demoDay"><span>Vorschau: Heute ist der</span><span id="demoLabel"></span></label>
    <input type="range" id="demoDay" min="0" max="25" value="10">
    <button type="button" id="reset">Geöffnete Türchen zurücksetzen</button>
  </div>

  <main class="grid" id="grid" aria-label="24 Türchen"></main>
</div>

<svg class="village" viewBox="0 0 400 90" preserveAspectRatio="none" aria-hidden="true">
  <path fill="#f4f1ea" d="M0 60 Q60 40 120 55 T240 50 T400 45 V90 H0Z"/>
  <g fill="#0a1626">
    <path d="M40 58 h26 v-16 l-13 -11 l-13 11z"/><path d="M70 56 h18 v-12 l-9 -8 l-9 8z"/>
    <path d="M300 50 h30 v-18 l-15 -13 l-15 13z"/><path d="M335 49 h16 v-10 l-8 -7 l-8 7z"/>
    <path d="M200 52 l10 -28 l10 28z"/><path d="M215 52 l7 -20 l7 20z"/>
  </g>
  <g fill="#ffd98a"><rect x="49" y="46" width="5" height="5"/><rect x="77" y="47" width="4" height="4"/><rect x="311" y="37" width="6" height="6"/></g>
</svg>
<footer>Jeden Tag im Dezember lässt sich ein neues Türchen öffnen.</footer>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <div class="big-emoji" id="cardEmoji"></div>
    <div class="day" id="cardDay"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardText"></p>
    <p class="sig">Dein Lenny</p>
    <button type="button" id="close">Schließen</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===== Einstellungen =====
const YEAR = 2026;
const DEMO = new URLSearchParams(location.search).has("demo"); // Vorschau mit Datumsregler: Link mit ?demo öffnen
const STORE_KEY = "svenja-advent-" + YEAR;

// Beispielinhalte. Hier schreibt Lenny später seine eigenen Texte rein.
const DAYS = {
  1:  ["🎄", "Los geht's!", "Ab heute gibt es jeden Tag eine kleine Überraschung von mir. Ich freu mich schon auf Weihnachten mit dir!"],
  2:  ["☕", "Gutschein", "Einmal Kaffee ans Bett. Ich bringe ihn dir an einem Wochenende deiner Wahl."],
  3:  ["😂", "Witz des Tages", "Was macht ein Schneemann im Sommer? Er schwitzt!"],
  4:  ["💛", "Was ich an dir mag", "Dass du immer weißt, wenn ich traurig bin, auch wenn ich nichts sage."],
  5:  ["🧦", "Nikolaus kommt", "Hast du deine Stiefel schon geputzt? Morgen früh wird nachgeschaut!"],
  6:  ["🎅", "Nikolaustag", "Heute darfst du dir aussuchen, was es zum Abendessen gibt."],
  7:  ["🧹", "Gutschein", "Ich räume einmal ohne Meckern mein Zimmer auf. Versprochen."],
  8:  ["🎵", "Lied des Tages", "Hör dir heute dein Lieblings-Weihnachtslied an. Ich sing mit, wenn du willst."],
  9:  ["⛄", "Rätsel", "Ich bin weiß, habe eine Karottennase und schmelze dahin, wenn die Sonne scheint. Wer bin ich?"],
  10: ["🍪", "Plätzchen-Tag", "Lass uns zusammen Plätzchen backen. Ich mache den Teig, du die Glasur?"],
  11: ["🤗", "Gutschein", "Eine extra lange Umarmung. Einlösbar jederzeit, auch mehrmals."],
  12: ["📸", "Erinnerung", "Weißt du noch, unser Urlaub am Meer? Das war einer meiner schönsten Tage."],
  13: ["⭐", "Was ich an dir mag", "Dass du die besten Geschichten zum Einschlafen erzählst."],
  14: ["🎲", "Spieleabend", "Heute Abend spielen wir ein Spiel deiner Wahl. Und ich lasse dich vielleicht gewinnen."],
  15: ["🧣", "Spaziergang", "Lass uns heute zusammen rausgehen und die Weihnachtslichter anschauen."],
  16: ["😂", "Witz des Tages", "Warum hat der Weihnachtsmann keine Kinder? Weil er nur einmal im Jahr kommt. (Den hat mir Papa erzählt.)"],
  17: ["🍫", "Süße Pause", "Schau mal in die Küchenschublade. Da liegt was für dich."],
  18: ["💛", "Was ich an dir mag", "Dass du mich so nimmst, wie ich bin."],
  19: ["🎬", "Filmabend", "Heute gibt es einen Weihnachtsfilm mit Popcorn. Ich mache das Popcorn."],
  20: ["🛁", "Gutschein", "Eine Stunde Ruhe nur für dich. Ich störe nicht, Ehrenwort."],
  21: ["🌟", "Kürzester Tag", "Heute ist der kürzeste Tag des Jahres. Ab morgen wird es wieder heller."],
  22: ["✉️", "Ein Brief", "Unter deinem Kopfkissen wartet heute Abend ein Brief von mir."],
  23: ["🎁", "Fast geschafft", "Nur noch einmal schlafen! Bist du auch so aufgeregt wie ich?"],
  24: ["🎄", "Frohe Weihnachten!", "Danke, dass du die beste Mama der Welt bist. Ich hab dich ganz doll lieb!"],
};

// Reihenfolge und Größe der Türchen im Raster (gemischt wie bei einem echten Kalender)
const LAYOUT = [
  [7,""],[18,""],[3,"wide"],[24,"big"],[11,""],[21,""],[1,""],[14,""],
  [9,"wide"],[5,""],[20,""],[16,""],[2,""],[12,"wide"],[22,""],[8,""],
  [17,""],[4,""],[19,"wide"],[10,""],[13,""],[23,""],[6,"wide"],[15,""]
];
const COLORS = ["var(--red)","var(--green)","var(--plum)","#2b4a7a","#8a5a1e","var(--red)","var(--green)"];

// ===== Logik =====
const $ = id => document.getElementById(id);
let demoDay = 10;
let opened = load();

function load() { try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch { return new Set(); } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...opened])); } catch {} }

function now() {
  if (!DEMO) return new Date();
  return demoDay === 0 ? new Date(YEAR, 10, 28) : new Date(YEAR, 11, demoDay, 12);
}
const unlockDate = n => new Date(YEAR, 11, n);
const isUnlocked = n => now() >= unlockDate(n);
const isToday = n => { const t = now(); return t.getFullYear() === YEAR && t.getMonth() === 11 && t.getDate() === n; };

function build() {
  const grid = $("grid");
  grid.innerHTML = "";
  LAYOUT.forEach(([n, size], i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "door " + size;
    b.dataset.n = n;
    b.style.setProperty("--c", COLORS[(n * 3 + i) % COLORS.length]);
    b.innerHTML = `<span class="inside" aria-hidden="true">${DAYS[n][0]}</span>
      <span class="leaf"><span class="num">${n}</span><span class="lock"></span></span>`;
    b.addEventListener("click", () => tap(b, n));
    grid.appendChild(b);
  });
  refresh();
}

function refresh() {
  document.querySelectorAll(".door").forEach(b => {
    const n = +b.dataset.n;
    const unlocked = isUnlocked(n);
    if (!unlocked) opened.delete(n);   // im Demo-Modus beim Zurückdrehen wieder schließen
    b.classList.toggle("locked", !unlocked);
    b.classList.toggle("today", unlocked && isToday(n) && !opened.has(n));
    b.classList.toggle("open", opened.has(n));
    b.setAttribute("aria-label", `Türchen ${n}` + (opened.has(n) ? ", geöffnet" : unlocked ? "" : ", noch verschlossen"));
  });
  const t = now();
  const s = $("status");
  if (t < unlockDate(1)) {
    const days = Math.ceil((unlockDate(1) - t) / 864e5);
    s.textContent = `Noch ${days} ${days === 1 ? "Tag" : "Tage"}, dann geht das erste Türchen auf.`;
  } else if (t.getMonth() === 11 && t.getDate() <= 24 && t.getFullYear() === YEAR) {
    const left = 24 - t.getDate();
    s.textContent = left ? `Heute ist der ${t.getDate()}. Dezember. Noch ${left} ${left === 1 ? "Tag" : "Tage"} bis Heiligabend.` : "Heute ist Heiligabend!";
  } else {
    s.textContent = "Frohe Weihnachten! Alle Türchen sind offen.";
  }
  if (DEMO) $("demoLabel").textContent = demoDay === 0 ? "28. November" : demoDay + ". Dezember";
  save();
}

function tap(b, n) {
  if (!isUnlocked(n)) {
    b.classList.remove("wiggle"); void b.offsetWidth; b.classList.add("wiggle");
    const d = Math.ceil((unlockDate(n) - now()) / 864e5);
    toast(`Noch nicht schummeln, Mama! Türchen ${n} geht am ${n}. Dezember auf.`);
    return;
  }
  const first = !opened.has(n);
  opened.add(n); refresh();
  setTimeout(() => show(n), first ? 650 : 0);
}

function show(n) {
  const [e, title, text] = DAYS[n];
  $("cardEmoji").textContent = e;
  $("cardDay").textContent = n + ". Dezember";
  $("cardTitle").textContent = title;
  $("cardText").textContent = text;
  const o = $("overlay");
  o.hidden = false;
  requestAnimationFrame(() => o.classList.add("show"));
  $("close").focus();
}
function hide() {
  const o = $("overlay");
  o.classList.remove("show");
  setTimeout(() => (o.hidden = true), 250);
}
$("close").addEventListener("click", hide);
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") hide(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

if (DEMO) {
  $("demo").hidden = false;
  $("demoDay").addEventListener("input", e => { demoDay = +e.target.value; refresh(); });
  $("reset").addEventListener("click", () => { opened.clear(); refresh(); });
  // Beispiel: ein paar Türchen schon geöffnet
  if (!opened.size) [1,2,3,5,6,8].forEach(n => opened.add(n));
}
build();

// ===== Schneefall =====
(() => {
  const c = $("snow"), ctx = c.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, flakes;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    flakes = Array.from({ length: Math.round(w * h / 9000) }, () => ({
      x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2 + .6, s: Math.random() * .6 + .3, o: Math.random() * Math.PI * 2
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = "rgba(244,241,234,.8)";
    for (const f of flakes) {
      if (!still) { f.y += f.s; f.o += .01; f.x += Math.sin(f.o) * .3; if (f.y > h + 3) { f.y = -3; f.x = Math.random() * w; } }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { size(); if (still) draw(); });
  size(); draw();
})();
</script>
</body>
</html>
