<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Svenjas Adventskalender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101d36">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Layout: Lebkuchenhaus in einer Schneenacht. Fenster und Haustür sind die Türchen, die 24 sitzt im Giebel. Davor ein Körbchen mit Welpen. */
:root {
  color-scheme: dark;
  --night: #101d36;
  --night-2: #1d3563;
  --snow: #f6f3ee;
  --snow-dim: #c3cbe0;
  --ginger: #a8642c;
  --ginger-dark: #7f4519;
  --icing: #ffffff;
  --glow: #ffd98a;
  --red: #c0392b;
  --green: #2e7d5b;
  --gold: #d9a52e;
  --blue: #2f6cb0;
  --ink: #2a1a10;
  --font-display: "Fraunces", Georgia, serif;
  --font-body: "Nunito", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; overflow-x: hidden;
  background: radial-gradient(130% 60% at 50% 0%, var(--night-2), var(--night) 75%) fixed, var(--night);
  color: var(--snow); font-family: var(--font-body); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
#snow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
.wrap {
  position: relative; z-index: 1; max-width: 460px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 0; display: flex; flex-direction: column; gap: 14px;
}
header { text-align: center; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--glow); font-weight: 800; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(28px, 8.5vw, 40px); line-height: 1.05; margin: 0; text-wrap: balance; }
h1 em { font-style: italic; font-weight: 500; color: var(--glow); }
.status { color: var(--snow-dim); font-size: 15px; margin: 2px 0 0; min-height: 1.4em; }

.demo { border: 1px dashed rgba(255,217,138,.55); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; background: rgba(16,29,54,.7); }
.demo label { display: flex; justify-content: space-between; gap: 12px; color: var(--glow); font-weight: 800; }
.demo input { width: 100%; accent-color: var(--glow); }
.demo button { align-self: flex-start; background: none; border: 0; color: var(--snow-dim); text-decoration: underline; font: inherit; padding: 0; cursor: pointer; }

/* ---------- Haus ---------- */
.house { position: relative; width: 100%; margin-top: 8px; }
.roof { position: relative; }
.roof svg { display: block; width: 100%; height: auto; overflow: visible; }
.bead { animation: twinkle 2.4s ease-in-out infinite; }
@keyframes twinkle { 50% { opacity: .35; } }
.smoke { position: absolute; left: 76.5%; top: 15%; width: 0; height: 0; }
.smoke span { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: rgba(230,235,245,.55); filter: blur(1px); animation: smoke 4.5s linear infinite; opacity: 0; }
.smoke span:nth-child(2) { animation-delay: 1.5s; }
.smoke span:nth-child(3) { animation-delay: 3s; }
@keyframes smoke { 0% { transform: translate(0,0) scale(.5); opacity: 0; } 15% { opacity: .8; } 100% { transform: translate(26px,-70px) scale(2.2); opacity: 0; } }

.body {
  position: relative; width: 88%; margin: -1px auto 0;
  background: var(--ginger);
  background-image: radial-gradient(rgba(70,30,5,.22) 1px, transparent 1.6px), radial-gradient(rgba(255,220,170,.12) 1px, transparent 1.6px);
  background-size: 13px 13px, 17px 17px; background-position: 0 0, 6px 8px;
  padding: 22px 5% 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(10px, 3.4vw, 16px) clamp(10px, 3.6vw, 18px);
}
.body::before, .body::after { /* Zuckerguss-Kanten */
  content: ""; position: absolute; left: 0; right: 0; height: 10px;
  background: radial-gradient(circle at 50% 0, var(--icing) 5px, transparent 5.5px) 0 0 / 14px 10px repeat-x;
}
.body::before { top: 0; }
.body::after { bottom: -10px; background: radial-gradient(circle at 50% 0, var(--icing) 4.5px, transparent 5px) 0 0 / 12px 10px repeat-x; z-index: 2; }

/* ---------- Türchen ---------- */
.win {
  position: relative; border: 0; padding: 0; margin: 0; background: none; font: inherit; color: inherit; cursor: pointer;
  aspect-ratio: 1 / .95; perspective: 500px; border-radius: 12px 12px 6px 6px;
  box-shadow: 0 0 0 3px var(--icing), 0 3px 0 4px rgba(60,25,5,.35);
}
.win:focus-visible { outline: 3px solid var(--glow); outline-offset: 5px; }
.inside {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden;
  background: radial-gradient(circle at 50% 40%, #fff6dc, var(--glow) 45%, #d0913a 100%);
}
.inside .pup { position: absolute; left: 50%; bottom: -6%; width: 82%; transform: translate(-50%, 105%); transition: transform .7s cubic-bezier(.3,1.5,.5,1) .35s; }
.win.open .inside .pup { transform: translate(-50%, 0); }
.sh {
  position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden;
  background: var(--c, var(--red));
  background-image: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0) 50%);
  box-shadow: inset 0 0 0 2px rgba(255,255,255,.28);
  transition: transform .85s cubic-bezier(.3,1.25,.5,1); backface-visibility: hidden;
}
.sh.l { left: 0; transform-origin: left center; border-radius: 12px 0 0 6px; }
.sh.r { right: 0; transform-origin: right center; border-radius: 0 12px 6px 0; }
.sh .lbl { position: absolute; top: 0; bottom: 0; width: 200%; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 600; font-size: clamp(17px, 5.6vw, 25px); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.22); }
.sh.l .lbl { left: 0; } .sh.r .lbl { right: 0; }
.sh.r::after { content: ""; position: absolute; left: 3px; top: 50%; width: 5px; height: 5px; margin-top: 9px; border-radius: 50%; background: #fff; opacity: .8; }
.win.open .sh.l { transform: rotateY(-118deg); }
.win.open .sh.r { transform: rotateY(118deg); }
.win.locked .sh { filter: saturate(.8) brightness(.92); }
.win.today { animation: halo 2.2s ease-in-out infinite; }
@keyframes halo { 0%,100% { box-shadow: 0 0 0 3px var(--icing), 0 0 14px 4px rgba(255,217,138,.55); } 50% { box-shadow: 0 0 0 3px var(--glow), 0 0 26px 10px rgba(255,217,138,.8); } }
.win.wiggle .sh.l { animation: wl .5s; } .win.wiggle .sh.r { animation: wr .5s; }
@keyframes wl { 25% { transform: rotateY(-22deg); } 55% { transform: rotateY(-6deg); } 75% { transform: rotateY(-12deg); } }
@keyframes wr { 25% { transform: rotateY(22deg); } 55% { transform: rotateY(6deg); } 75% { transform: rotateY(12deg); } }

.door { grid-column: span 2; aspect-ratio: auto; border-radius: 48% 48% 4px 4px / 34% 34% 4px 4px; }
.door .sh.l { border-radius: 999px 0 0 0 / 70% 0 0 0; } .door .sh.r { border-radius: 0 999px 0 0 / 0 70% 0 0; }
.door .sh .lbl { font-size: clamp(22px, 7vw, 32px); }
.door .inside .pup { width: 58%; }

.gable { position: absolute; left: 50%; top: 63%; width: 21%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; }
.gable .sh.l { border-radius: 999px 0 0 999px; } .gable .sh.r { border-radius: 0 999px 999px 0; }
.gable .sh .lbl { font-size: clamp(22px, 7.5vw, 34px); }

/* ---------- Garten mit Welpen ---------- */
.yard { position: relative; margin-top: -8px; margin-inline: -16px; z-index: 2; }
.yard svg { display: block; width: 100%; height: auto; }
.head-l { animation: bob 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }
.head-r { animation: bob 2.8s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: 50% 90%; }
@keyframes bob { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
.blink { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
.wag { animation: wag .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 100%; }
@keyframes wag { from { transform: rotate(-18deg); } to { transform: rotate(22deg); } }

footer { position: relative; z-index: 1; background: var(--snow); color: #34405a; text-align: center; padding: 2px 16px calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 13px; margin-top: -2px; }

/* ---------- Funkeln beim Öffnen ---------- */
.spark { position: fixed; z-index: 15; pointer-events: none; font-size: 14px; color: var(--glow); left: 0; top: 0; animation: spark .9s ease-out forwards; }
@keyframes spark { 0% { transform: translate(var(--x0), var(--y0)) scale(.4); opacity: 1; } 100% { transform: translate(var(--x1), var(--y1)) scale(1.1) rotate(160deg); opacity: 0; } }

/* ---------- Pop-up ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 20; background: rgba(6,10,22,.74); display: grid; place-items: center; overflow-y: auto;
  padding: max(56px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  opacity: 0; transition: opacity .25s;
}
.overlay.show { opacity: 1; }
.card {
  position: relative; width: min(100%, 400px); background: var(--snow); color: #1d2a40; border-radius: 20px;
  padding: 58px 22px 20px; display: flex; flex-direction: column; gap: 10px; text-align: center;
  box-shadow: 0 0 0 4px var(--ginger), 0 22px 60px rgba(0,0,0,.5);
  transform: translateY(18px) scale(.94); transition: transform .35s cubic-bezier(.3,1.4,.5,1);
}
.card::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 12px; border-radius: 20px 20px 0 0;
  background: radial-gradient(circle at 50% 100%, var(--ginger) 5px, transparent 5.5px) 0 0 / 14px 12px repeat-x; opacity: .35; }
.overlay.show .card { transform: none; }
.card .peek { position: absolute; left: 50%; top: -52px; width: 104px; transform: translateX(-50%); }
.card .day { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--red); font-weight: 800; }
.card h2 { font-family: var(--font-display); font-weight: 600; font-size: 26px; margin: 0; text-wrap: balance; }
.card p { margin: 0; line-height: 1.55; font-size: 16px; }
.card .media { width: 100%; border-radius: 12px; display: block; background: #e7e1d6; }
.card .hint { background: #fff1d6; border: 2px dashed var(--gold); border-radius: 12px; padding: 12px; font-weight: 600; }
.card .sig { font-family: var(--font-display); font-style: italic; color: var(--green); font-size: 18px; }
.card button { margin-top: 6px; align-self: center; border: 0; background: var(--green); color: var(--snow); font: 800 15px var(--font-body); padding: 12px 28px; border-radius: 999px; cursor: pointer; }
.card button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  transform: translate(-50%, 20px); opacity: 0; transition: .25s; pointer-events: none;
  background: var(--snow); color: #1d2a40; padding: 10px 16px 10px 10px; border-radius: 14px;
  font-weight: 600; font-size: 15px; width: max-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.toast svg { width: 42px; flex: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  .sh, .overlay, .card, .toast, .inside .pup { transition: none; }
  .win.today, .win.wiggle .sh, .bead, .smoke span, .head-l, .head-r, .blink, .wag, .spark { animation: none; }
}
</style>
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>

<div class="wrap">
  <header>
    <span class="eyebrow">Von Lenny für Mama</span>
    <h1>Svenjas <em>Advents&shy;kalender</em></h1>
    <p class="status" id="status"></p>
  </header>

  <!-- Nur zum Ausprobieren. Für Svenja DEMO = false setzen. -->
  <div class="demo" id="demo" hidden>
    <label for="demoDay"><span>Vorschau: Heute ist der</span><span id="demoLabel"></span></label>
    <input type="range" id="demoDay" min="0" max="25" value="10">
    <button type="button" id="reset">Geöffnete Türchen zurücksetzen</button>
  </div>

  <div class="house">
    <div class="roof">
      <svg viewBox="0 0 400 200" aria-hidden="true">
        <rect x="286" y="34" width="40" height="96" fill="#8a4f22"/>
        <rect x="280" y="26" width="52" height="14" rx="5" fill="#fff"/>
        <polygon points="2,200 200,16 398,200" fill="#8a4f22"/>
        <polygon points="200,16 398,200 200,200" fill="#7a4419" opacity=".55"/>
        <g id="icing" fill="#fff"></g>
        <g id="beads"></g>
      </svg>
      <div class="smoke" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <main class="body" id="body" aria-label="Türchen"></main>
  </div>

  <div class="yard" id="yard"></div>
</div>
<footer>Jeden Tag im Dezember geht ein neues Fenster auf.</footer>

<div class="overlay" id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <div class="peek" id="peek" aria-hidden="true"></div>
    <div class="day" id="cardDay"></div>
    <h2 id="cardTitle"></h2>
    <div id="cardBody" style="display:flex;flex-direction:column;gap:10px"></div>
    <p class="sig">Dein Lenny</p>
    <button type="button" id="close">Schließen</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// ===================== Einstellungen =====================
const YEAR = 2026;
const DEMO = true;           // Datumsregler zum Ausprobieren. Für Svenja auf false stellen.
const FRONT_DOOR = 6;        // Welcher Tag die große Haustür ist (24 ist immer der Giebel)
const STORE_KEY = "svenja-advent-" + YEAR;

// Inhalte. type: "text" | "hint" | "photo" | "video" | "audio"  (src = Dateiname für Foto, Video, Audio)
const DAYS = {
  1:  { type: "text",  title: "Los geht's!", text: "Ab heute wartet jeden Tag eine kleine Überraschung von mir auf dich. Ich freu mich schon so auf Weihnachten mit dir!" },
  2:  { type: "text",  title: "Gutschein", text: "Einmal Kaffee ans Bett. Ich bringe ihn dir an einem Wochenende deiner Wahl." },
  3:  { type: "text",  title: "Witz des Tages", text: "Was macht ein Schneemann im Sommer? Er schwitzt!" },
  4:  { type: "text",  title: "Was ich an dir mag", text: "Dass du immer merkst, wenn ich traurig bin, auch wenn ich nichts sage." },
  5:  { type: "text",  title: "Morgen ist Nikolaus", text: "Hast du deine Stiefel schon geputzt? Morgen früh wird nachgeschaut!" },
  6:  { type: "hint",  title: "Ein echtes Geschenk!", text: "Heute wartet etwas Besonderes auf dich. Schau mal im Flur in deinen Stiefeln nach." },
  7:  { type: "text",  title: "Gutschein", text: "Ich räume einmal ohne Meckern mein Zimmer auf. Versprochen." },
  8:  { type: "text",  title: "Lied des Tages", text: "Hör dir heute dein Lieblings-Weihnachtslied an. Ich sing mit, wenn du willst." },
  9:  { type: "text",  title: "Rätsel", text: "Ich bin weiß, habe eine Karottennase und schmelze dahin, wenn die Sonne scheint. Wer bin ich?" },
  10: { type: "text",  title: "Plätzchen-Tag", text: "Lass uns zusammen Plätzchen backen. Ich mache den Teig, du die Glasur?" },
  11: { type: "text",  title: "Gutschein", text: "Eine extra lange Umarmung. Einlösbar jederzeit, auch mehrmals." },
  12: { type: "text",  title: "Erinnerung", text: "Weißt du noch, unser Urlaub am Meer? Das war einer meiner schönsten Tage." },
  13: { type: "text",  title: "Was ich an dir mag", text: "Dass du die besten Geschichten zum Einschlafen erzählst." },
  14: { type: "text",  title: "Spieleabend", text: "Heute Abend spielen wir ein Spiel deiner Wahl. Und ich lasse dich vielleicht gewinnen." },
  15: { type: "text",  title: "Spaziergang", text: "Lass uns heute zusammen rausgehen und die Weihnachtslichter anschauen." },
  16: { type: "text",  title: "Witz des Tages", text: "Was sagt ein Welpe am 24. Dezember? Frohe Weih-Wau-Wau-nachten!" },
  17: { type: "hint",  title: "Süße Pause", text: "Schau mal in die Küchenschublade. Da liegt was für dich." },
  18: { type: "text",  title: "Was ich an dir mag", text: "Dass du mich so nimmst, wie ich bin." },
  19: { type: "text",  title: "Filmabend", text: "Heute gibt es einen Weihnachtsfilm mit Popcorn. Ich mache das Popcorn." },
  20: { type: "text",  title: "Gutschein", text: "Eine Stunde Ruhe nur für dich. Ich störe nicht, Ehrenwort." },
  21: { type: "text",  title: "Kürzester Tag", text: "Heute ist der kürzeste Tag des Jahres. Ab morgen wird es wieder heller." },
  22: { type: "hint",  title: "Ein Brief", text: "Unter deinem Kopfkissen wartet heute Abend ein Brief von mir." },
  23: { type: "text",  title: "Fast geschafft", text: "Nur noch einmal schlafen! Bist du auch so aufgeregt wie ich?" },
  24: { type: "text",  title: "Frohe Weihnachten!", text: "Danke, dass du die beste Mama der Welt bist. Ich hab dich ganz doll lieb!" },
};

// Fenster-Reihenfolge im Haus (ohne Haustür und Giebel), 5 Reihen à 4 plus 2 neben der Tür
const WINDOWS = [7,18,3,11,21,1,14,9,20,16,2,12,22,8,17,4,19,10,13,23,  5,15];
const SHUTTERS = ["var(--red)","var(--green)","var(--gold)","var(--blue)"];
const FURS = [
  { fur: "#e3ad6a", ear: "#c98d4c", face: "#f2cf9a" },  // golden
  { fur: "#f0dcb6", ear: "#d6b98a", face: "#fbeed6" },  // creme
  { fur: "#e1945a", ear: "#c0703a", face: "#f4bf8f" },  // apricot
  { fur: "#8a5a3c", ear: "#684027", face: "#b98a68" },  // schoko
];

// ===================== Welpe (SVG) =====================
function pup(f, { hat = false, anim = "" } = {}) {
  let curls = "";
  for (let a = 0; a < 360; a += 30) { const r = a * Math.PI / 180; curls += `<circle cx="${(Math.cos(r)*15).toFixed(1)}" cy="${(Math.sin(r)*14).toFixed(1)}" r="7"/>`; }
  return `<svg class="pup" viewBox="-34 -42 68 66" aria-hidden="true"><g class="${anim}">
    <ellipse cx="-19" cy="6" rx="8" ry="15" fill="${f.ear}" transform="rotate(18 -19 6)"/>
    <ellipse cx="19" cy="6" rx="8" ry="15" fill="${f.ear}" transform="rotate(-18 19 6)"/>
    <g fill="${f.fur}">${curls}<circle r="16"/></g>
    <ellipse cx="0" cy="7" rx="10.5" ry="8.5" fill="${f.face}"/>
    <g class="${anim ? "blink" : ""}"><circle cx="-6.5" cy="-1" r="2.8" fill="#2b1a10"/><circle cx="6.5" cy="-1" r="2.8" fill="#2b1a10"/>
    <circle cx="-5.6" cy="-2" r="1" fill="#fff"/><circle cx="7.4" cy="-2" r="1" fill="#fff"/></g>
    <ellipse cx="-10.5" cy="5" rx="2.6" ry="1.6" fill="#f2a0a0" opacity=".7"/><ellipse cx="10.5" cy="5" rx="2.6" ry="1.6" fill="#f2a0a0" opacity=".7"/>
    <ellipse cx="0" cy="5" rx="3.4" ry="2.5" fill="#3a2216"/>
    <path d="M-3.5 8.5 Q0 11.5 3.5 8.5" fill="none" stroke="#3a2216" stroke-width="1"/>
    <ellipse cx="0" cy="11.6" rx="2" ry="2.3" fill="#e8778a"/>
    ${hat ? `<path d="M-15 -12 Q0 -18 15 -13 L9 -36 Q2 -30 -15 -12Z" fill="#c0392b"/><rect x="-17" y="-16" width="34" height="6" rx="3" fill="#fff" transform="rotate(-3)"/><circle cx="9" cy="-36" r="4.5" fill="#fff"/>` : ""}
  </g></svg>`;
}

// ===================== Dach und Garten =====================
(() => {
  let ic = "", bd = "";
  for (let i = 0; i <= 18; i++) { const t = i / 18;
    ic += `<circle cx="${(2 + t*198).toFixed(1)}" cy="${(200 - t*184).toFixed(1)}" r="8"/><circle cx="${(398 - t*198).toFixed(1)}" cy="${(200 - t*184).toFixed(1)}" r="8"/>`; }
  const cols = ["#ff5a4a","#ffd24a","#5fd38a","#6fb7ff"];
  for (let i = 0; i < 15; i++) bd += `<circle class="bead" style="animation-delay:${(i%4)*.6}s" cx="${36 + i*23}" cy="194" r="5.5" fill="${cols[i%4]}"/>`;
  document.getElementById("icing").innerHTML = ic;
  document.getElementById("beads").innerHTML = bd;

  const p1 = pup(FURS[0], { hat: true, anim: "head-l" }).replace('<svg class="pup" viewBox="-34 -42 68 66"', '<svg x="92" y="6" width="96" height="94" viewBox="-34 -42 68 66"');
  const p2 = pup(FURS[1], { hat: true, anim: "head-r" }).replace('<svg class="pup" viewBox="-34 -42 68 66"', '<svg x="160" y="0" width="104" height="100" viewBox="-34 -42 68 66"');
  document.getElementById("yard").innerHTML = `<svg viewBox="0 0 400 190" aria-hidden="true">
    <path d="M0 8 Q100 -2 200 6 T400 4 V190 H0Z" fill="#f6f3ee"/><g transform="translate(0 44)">
    <path d="M0 60 Q120 46 220 58 T400 52" stroke="#dfe6f0" stroke-width="3" fill="none"/>

      <circle cx="-8" cy="-14" r="3" fill="#ff5a4a" class="bead"/><circle cx="7" cy="-26" r="3" fill="#ffd24a" class="bead" style="animation-delay:.8s"/><circle cx="4" cy="-8" r="3" fill="#6fb7ff" class="bead" style="animation-delay:1.6s"/></g>
    <path class="wag" d="M250 98 q16 -6 18 -22" stroke="#e3ad6a" stroke-width="7" fill="none" stroke-linecap="round"/>

      <circle cx="-5" cy="0" r="1.8" fill="#222"/><circle cx="5" cy="0" r="1.8" fill="#222"/><polygon points="0,4 12,7 0,9" fill="#f08a2a"/><path d="M-14 12 h28" stroke="#c0392b" stroke-width="5"/></g>
  </g></svg>`;
})();

// ===================== Logik =====================
const $ = id => document.getElementById(id);
let demoDay = 10;
let opened = load();
function load() { try { return new Set(JSON.parse(localStorage.getItem(STORE_KEY) || "[]")); } catch { return new Set(); } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify([...opened])); } catch {} }
function now() { if (!DEMO) return new Date(); return demoDay === 0 ? new Date(YEAR, 10, 28, 12) : new Date(YEAR, 11, demoDay, 12); }
const unlockDate = n => new Date(YEAR, 11, n);
const isUnlocked = n => now() >= unlockDate(n);
const isToday = n => { const t = now(); return t.getFullYear() === YEAR && t.getMonth() === 11 && t.getDate() === n; };

function makeWin(n, cls) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "win " + cls; b.dataset.n = n;
  b.style.setProperty("--c", SHUTTERS[(n * 7) % 4]);
  b.innerHTML = `<span class="inside">${pup(FURS[n % 4], { hat: n === 24 || n === FRONT_DOOR })}</span>
    <span class="sh l"><span class="lbl">${n}</span></span><span class="sh r"><span class="lbl">${n}</span></span>`;
  b.addEventListener("click", () => tap(b, n));
  return b;
}
function build() {
  const body = $("body");
  WINDOWS.slice(0, 20).forEach(n => body.appendChild(makeWin(n, "")));
  body.appendChild(makeWin(WINDOWS[20], ""));
  body.appendChild(makeWin(FRONT_DOOR, "door"));
  body.appendChild(makeWin(WINDOWS[21], ""));
  document.querySelector(".roof").appendChild(makeWin(24, "gable"));
  refresh();
}
function refresh() {
  document.querySelectorAll(".win").forEach(b => {
    const n = +b.dataset.n, unlocked = isUnlocked(n);
    if (!unlocked) opened.delete(n);
    b.classList.toggle("locked", !unlocked);
    b.classList.toggle("today", unlocked && isToday(n) && !opened.has(n));
    b.classList.toggle("open", opened.has(n));
    b.setAttribute("aria-label", `Türchen ${n}` + (opened.has(n) ? ", geöffnet" : unlocked ? "" : ", noch verschlossen"));
  });
  const t = now(), s = $("status");
  if (t < unlockDate(1)) { const d = Math.ceil((unlockDate(1) - t) / 864e5); s.textContent = `Noch ${d} ${d === 1 ? "Tag" : "Tage"}, dann geht das erste Fenster auf.`; }
  else if (t.getFullYear() === YEAR && t.getMonth() === 11 && t.getDate() < 24) { const l = 24 - t.getDate(); s.textContent = `Heute ist der ${t.getDate()}. Dezember. Noch ${l} ${l === 1 ? "Tag" : "Tage"} bis Heiligabend.`; }
  else if (isToday(24)) s.textContent = "Heute ist Heiligabend!";
  else s.textContent = "Frohe Weihnachten! Alle Fenster sind offen.";
  if (DEMO) $("demoLabel").textContent = demoDay === 0 ? "28. November" : demoDay + ". Dezember";
  save();
}

function tap(b, n) {
  if (!isUnlocked(n)) {
    b.classList.remove("wiggle"); void b.offsetWidth; b.classList.add("wiggle");
    toast(`Wuff! Nicht schummeln, Mama. Fenster ${n} geht erst am ${n}. Dezember auf.`);
    return;
  }
  const first = !opened.has(n);
  opened.add(n); refresh();
  if (first) sparkle(b);
  setTimeout(() => show(n), first ? 950 : 0);
}
function sparkle(el) {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 14; i++) {
    const s = document.createElement("span"), a = Math.random() * Math.PI * 2, d = 40 + Math.random() * 50;
    s.className = "spark"; s.textContent = i % 3 ? "✦" : "❄";
    s.style.setProperty("--x0", cx - 7 + "px"); s.style.setProperty("--y0", cy - 9 + "px");
    s.style.setProperty("--x1", cx - 7 + Math.cos(a) * d + "px"); s.style.setProperty("--y1", cy - 9 + Math.sin(a) * d + "px");
    s.style.color = ["#ffd98a", "#ffffff", "#ff8a7a"][i % 3];
    document.body.appendChild(s); setTimeout(() => s.remove(), 950);
  }
}

function show(n) {
  const d = DAYS[n];
  $("peek").innerHTML = pup(FURS[n % 4], { hat: true });
  $("cardDay").textContent = n + ". Dezember";
  $("cardTitle").textContent = d.title;
  const box = $("cardBody"); box.innerHTML = "";
  const add = (tag, props) => { const e = document.createElement(tag); Object.assign(e, props); box.appendChild(e); return e; };
  if (d.type === "photo") add("img", { src: d.src, alt: d.title, className: "media" });
  if (d.type === "video") add("video", { src: d.src, controls: true, playsInline: true, className: "media" });
  if (d.type === "audio") add("audio", { src: d.src, controls: true, className: "media" });
  if (d.text) add("p", { textContent: d.text, className: d.type === "hint" ? "hint" : "" });
  const o = $("overlay"); o.hidden = false;
  requestAnimationFrame(() => o.classList.add("show"));
  $("close").focus();
}
function hide() {
  const o = $("overlay"); o.classList.remove("show");
  o.querySelectorAll("video, audio").forEach(m => m.pause());
  setTimeout(() => (o.hidden = true), 250);
}
$("close").addEventListener("click", hide);
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") hide(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });

let toastTimer;
function toast(msg) {
  const t = $("toast");
  t.innerHTML = pup(FURS[2]) + "<span></span>"; t.lastChild.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

if (DEMO) {
  $("demo").hidden = false;
  $("demoDay").addEventListener("input", e => { demoDay = +e.target.value; refresh(); });
  $("reset").addEventListener("click", () => { opened.clear(); refresh(); });
  if (!opened.size) [1,2,3,4,6,8].forEach(n => opened.add(n));
}
build();

// ===================== Schneefall =====================
(() => {
  const c = $("snow"), ctx = c.getContext("2d"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, flakes;
  function size() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    flakes = Array.from({ length: Math.round(w * h / 8000) }, () => ({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 2.1 + .6, s: Math.random() * .6 + .3, o: Math.random() * 6.3 }));
  }
  function draw() {
    ctx.clearRect(0, 0, w, h); ctx.fillStyle = "rgba(246,243,238,.85)";
    for (const f of flakes) {
      if (!still) { f.y += f.s; f.o += .01; f.x += Math.sin(f.o) * .3; if (f.y > h + 3) { f.y = -3; f.x = Math.random() * w; } }
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener("resize", () => { size(); if (still) draw(); });
  size(); draw();
})();
</script>
